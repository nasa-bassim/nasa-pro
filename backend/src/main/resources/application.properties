spring.application.name=lunar-backend
server.port=${PORT:8080}
ephemeris.cache-dir=${EPHEMERIS_CACHE_DIR:cache}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Maximum waiting operations (same-key callers share one operation).
ephemeris.queue-capacity=16
# Includes queue wait, request spacing and upstream response.
ephemeris.request-timeout=120s
